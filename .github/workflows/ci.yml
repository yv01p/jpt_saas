name: CI
on: [push, pull_request]
jobs:
  trivy-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # required for github/codeql-action SARIF upload
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Build project
        run: |
          export JAVA_HOME=$JAVA_HOME_21_X64
          ./gradlew :api:build :worker:build -x test
      - name: Run Trivy SBOM vulnerability scan
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402e8f6e2dc35db4b45b08  # v0.28.0
        with:
          scan-type: fs
          scanners: vuln
          format: sarif
          output: trivy-results.sarif
          exit-code: '1'
          severity: HIGH,CRITICAL
      - name: Upload SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@820e3160e279568db735cee8ed8f8e77a6da7818  # v3.32.6
        with:
          sarif_file: trivy-results.sarif

  trivy-docker-worker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0
      - name: Build worker image
        run: docker build -t worker:ci ./worker
      - name: Scan worker image for HIGH/CRITICAL CVEs
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402e8f6e2dc35db4b45b08  # v0.28.0
        with:
          image-ref: worker:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9  # v4.8.0
        with: { java-version: 21, distribution: temurin }
      - run: ./gradlew build  # includes test task via Gradle dependency graph (M18 fix)

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with: { node-version: 20 }
      - run: cd frontend && npm ci && npm test

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Create CI environment
        run: cp .env.ci .env
      - name: Build frontend
        run: cd frontend && npm ci && npm run build && cp -r dist ../react-build
      - run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --wait --wait-timeout 120  # M19, M20, M29 fix
      - run: cd frontend && npm ci && npx playwright install --with-deps  # M23 fix — install browsers + OS deps on E2E runner
      - run: cd frontend && npx playwright test

  nginx-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - run: docker run --rm -v $PWD/nginx.prod.conf:/etc/nginx/nginx.conf:ro nginx:alpine nginx -t
