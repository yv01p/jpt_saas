# prometheus.yml
global:
  scrape_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - 'alert_rules.yml'

scrape_configs:
  - job_name: 'api'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['api:8080']
  - job_name: 'worker'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['worker:8080']
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
