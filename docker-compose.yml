services:
  nginx:
    image: nginx:alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./react-build:/usr/share/nginx/html:ro
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_started
    networks:
      - frontend
    mem_limit: 128m
    cpus: '0.5'
    restart: unless-stopped

  api:
    build: ./api
    networks:
      - frontend
      - backend
    environment:
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
      MINIO_ACCESS_KEY: ${MINIO_API_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_API_SECRET_KEY}
      MINIO_PRESIGN_ACCESS_KEY: ${MINIO_API_PRESIGN_ACCESS_KEY}
      MINIO_PRESIGN_SECRET_KEY: ${MINIO_API_PRESIGN_SECRET_KEY}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: ${REDIS_URL}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@yourdomain.com}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      FLYWAY_DB_PASS: ${FLYWAY_DB_PASS}
      JPT_AUTH_PASSWORD: ${JPT_AUTH_PASSWORD}
      SHARE_READER_PASSWORD: ${SHARE_READER_PASSWORD}
    tmpfs:
      - /tmp:size=${API_TMPFS_SIZE:-512m},mode=1777
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: '1.5'
    restart: unless-stopped

  worker:
    build: ./worker
    networks:
      - backend
    environment:
      DB_URL: ${WORKER_DB_URL}
      DB_USER: ${WORKER_DB_USER}
      DB_PASS: ${WORKER_DB_PASS}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_WORKER_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_WORKER_SECRET_KEY}
      REDIS_URL: ${REDIS_URL}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/worker-heartbeat -mmin -1 | grep -q ."]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=${WORKER_TMPFS_SIZE:-1g},mode=1777
    mem_limit: 1g
    cpus: '2.0'
    restart: unless-stopped

  postgres:
    image: postgres:16@sha256:cedbd4a3809524b5d1c29fb855a695d9c688f1916ee29c07620ef35efe1d9732
    networks:
      - backend
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    cpus: '1.0'
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    networks:
      - backend
    volumes:
      - minio_data:/data
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_BROWSER: "off"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: '0.5'
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z-cpuv1
    networks:
      - backend
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_API_ACCESS_KEY: ${MINIO_API_ACCESS_KEY}
      MINIO_API_SECRET_KEY: ${MINIO_API_SECRET_KEY}
      MINIO_API_PRESIGN_ACCESS_KEY: ${MINIO_API_PRESIGN_ACCESS_KEY}
      MINIO_API_PRESIGN_SECRET_KEY: ${MINIO_API_PRESIGN_SECRET_KEY}
      MINIO_WORKER_ACCESS_KEY: ${MINIO_WORKER_ACCESS_KEY}
      MINIO_WORKER_SECRET_KEY: ${MINIO_WORKER_SECRET_KEY}
      MINIO_BACKUP_ACCESS_KEY: ${MINIO_BACKUP_ACCESS_KEY}
      MINIO_BACKUP_SECRET_KEY: ${MINIO_BACKUP_SECRET_KEY}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: '0.25'
    entrypoint: >
      /bin/sh -c "
        mc alias set minio http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
        mc mb --ignore-existing minio/jpt-photos &&
        (mc admin user add minio $$MINIO_API_ACCESS_KEY $$MINIO_API_SECRET_KEY || true) &&
        (mc admin policy attach minio readwrite --user $$MINIO_API_ACCESS_KEY || true) &&
        echo '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:GetObject\"],\"Resource\":[\"arn:aws:s3:::jpt-photos/*\"]},{\"Effect\":\"Allow\",\"Action\":[\"s3:GetBucketLocation\"],\"Resource\":[\"arn:aws:s3:::jpt-photos\"]}]}' > /tmp/presign-only-policy.json &&
        (mc admin policy create minio presign-only /tmp/presign-only-policy.json || true) &&
        (mc admin user add minio $$MINIO_API_PRESIGN_ACCESS_KEY $$MINIO_API_PRESIGN_SECRET_KEY || true) &&
        (mc admin policy attach minio presign-only --user $$MINIO_API_PRESIGN_ACCESS_KEY || true) &&
        echo '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:GetObject\",\"s3:PutObject\",\"s3:DeleteObject\"],\"Resource\":[\"arn:aws:s3:::jpt-photos/*/originals/*\",\"arn:aws:s3:::jpt-photos/*/thumbnails/*\"]},{\"Effect\":\"Allow\",\"Action\":[\"s3:GetBucketLocation\"],\"Resource\":[\"arn:aws:s3:::jpt-photos\"]}]}' > /tmp/worker-policy.json &&
        (mc admin user add minio $$MINIO_WORKER_ACCESS_KEY $$MINIO_WORKER_SECRET_KEY || true) &&
        (mc admin policy create minio worker-scoped-policy /tmp/worker-policy.json || true) &&
        (mc admin policy attach minio worker-scoped-policy --user $$MINIO_WORKER_ACCESS_KEY || true) &&
        (mc admin user add minio $$MINIO_BACKUP_ACCESS_KEY $$MINIO_BACKUP_SECRET_KEY || true) &&
        (mc admin policy attach minio readonly --user $$MINIO_BACKUP_ACCESS_KEY || true) &&
        echo minio-init complete"

  redis:
    image: redis:7-alpine@sha256:4bfd9eca23339865dc14fe75f6d9ae643f714924623978dd2798f1a673b08f43
    networks:
      - backend
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --appendfsync everysec --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: '0.5'
    restart: unless-stopped

  backup:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z-cpuv1
    networks:
      - backend
    restart: unless-stopped
    entrypoint: >
      /bin/sh -c "
        mc alias set minio http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY &&
        mc alias set b2 https://s3.us-west-004.backblazeb2.com $$B2_ACCESS_KEY $$B2_SECRET_KEY &&
        while true; do
          mc mirror minio/jpt-photos b2/jpt-photos-backup &&
          touch /tmp/backup-heartbeat;
          sleep 3600;
        done"
    environment:
      MINIO_ACCESS_KEY: ${MINIO_BACKUP_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_BACKUP_SECRET_KEY}
      B2_ACCESS_KEY: ${B2_BACKUP_ACCESS_KEY}
      B2_SECRET_KEY: ${B2_BACKUP_SECRET_KEY}
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/backup-heartbeat -mmin -120 | grep -q ."]
      interval: 60s
      timeout: 3s
      retries: 3
      start_period: 120s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: '0.25'
    depends_on:
      minio-init:
        condition: service_completed_successfully

  pgbackup:
    build: ./pgbackup
    networks:
      - backend
    restart: unless-stopped
    user: "1000:1000"
    entrypoint: >
      /bin/sh -c "
        while true; do
          PGPASSWORD=$$DB_PASS pg_dump -h postgres -U $$DB_USER $$DB_NAME |
          restic backup --stdin --stdin-filename postgres.sql
            -r b2:jpt-db-backup --password-file /run/secrets/restic_pass &&
          restic forget --prune --keep-daily 30 --keep-weekly 12
            -r b2:jpt-db-backup --password-file /run/secrets/restic_pass &&
          touch /tmp/pgbackup-heartbeat;
          sleep 86400;
        done"
    environment:
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME}
      B2_ACCOUNT_ID: ${B2_ACCOUNT_ID}
      B2_ACCOUNT_KEY: ${B2_ACCOUNT_KEY}
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/pgbackup-heartbeat -mmin -1500 | grep -q ."]
      interval: 300s
      timeout: 3s
      retries: 3
      start_period: 300s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: '0.25'
    secrets:
      - restic_pass
    depends_on:
      postgres:
        condition: service_healthy

  certbot:
    image: certbot/certbot
    networks:
      - frontend
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: '0.25'
    restart: unless-stopped
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do
        certbot renew --webroot -w /var/www/certbot;
        sleep 12h & wait $${!};
      done"

  prometheus:
    image: prom/prometheus:v2.53.0
    networks:
      - backend
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: '0.5'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    networks:
      - backend
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: '0.5'
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    networks:
      - backend
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    secrets:
      - smtp_alert_password
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    cpus: '0.25'
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.1
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    networks:
      - backend
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    cpus: '0.25'
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_EXPORTER_CHECK_STREAMS: "photo-jobs"
    networks:
      - backend
    depends_on:
      redis:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    cpus: '0.25'
    restart: unless-stopped

networks:
  frontend:
  backend:
    internal: true

volumes:
  postgres_data:
  minio_data:
  redis_data:
  certbot_certs:
  certbot_www:
  prometheus_data:
  grafana_data:

secrets:
  restic_pass:
    file: ./secrets/restic_pass.txt
  smtp_alert_password:
    file: ./secrets/smtp_alert_password.txt
