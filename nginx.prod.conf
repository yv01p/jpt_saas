# ============================================================
# PRODUCTION NGINX — TLS + Security Headers
# Before deploying:
#   1. Replace every occurrence of yourdomain.com with your domain.
#   2. Run certbot to obtain certificates:
#      docker compose run --rm certbot certbot certonly \
#        --webroot -w /var/www/certbot -d yourdomain.com
#   3. docker compose up -d nginx
# ============================================================

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Rate limiting zones — by client IP
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=register:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=share:10m rate=60r/m;

    # TLS session cache — shared across workers, 10 MB (~40 000 sessions)
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling — eliminates client round-trip to CA
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout    5s;

    # --------------------------------------------------------
    # HTTP → HTTPS redirect + ACME challenge (port 80)
    # --------------------------------------------------------
    server {
        listen 80;
        server_name _;

        # Certbot ACME challenge for Let's Encrypt cert renewal
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --------------------------------------------------------
    # HTTPS (port 443)
    # --------------------------------------------------------
    server {
        listen 443 ssl;
        server_name yourdomain.com;

        ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

        # Modern TLS — TLS 1.2 / 1.3 only, safe cipher suite order
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;

        # ---- Security headers -----------------------------------------------
        # HSTS — 2-year max-age; enables browser preload list eligibility.
        # IMPORTANT: only enable after confirming TLS is fully working.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        # Prevent MIME-type sniffing
        add_header X-Content-Type-Options "nosniff" always;
        # Prevent framing (clickjacking)
        add_header X-Frame-Options "DENY" always;
        # Limit Referer header leakage
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # CSP — restrict resource loading to same origin.
        # NOTE: Replace minio.yourdomain.com with the actual MINIO_PUBLIC_URL hostname.
        # If MinIO is served through this nginx (same origin), 'self' suffices and the extra host can be removed.
        # style-src includes 'unsafe-inline' — required by Tailwind/shadcn (design v4.0, SA#12/CR#7).
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://minio.yourdomain.com; style-src 'self' 'unsafe-inline'; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self';" always;
        # Restrict browser features — no camera, microphone, geolocation, or payment API
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        # ---------------------------------------------------------------------

        # React SPA
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        # Share SPA pages — rate-limited to prevent token enumeration
        location /share/ {
            limit_req zone=share burst=10 nodelay;
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        # Block actuator endpoints from public access — must not be internet-reachable
        location /api/actuator/ {
            deny all;
            return 404;
        }

        # Login endpoint — tighter rate limit than generic auth (longest-prefix match takes precedence)
        location /api/auth/login {
            client_max_body_size 16k;
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://api:8080/auth/login;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Register endpoint — tightest rate limit
        location /api/auth/register {
            client_max_body_size 16k;
            limit_req zone=register burst=3 nodelay;
            proxy_pass http://api:8080/auth/register;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Auth endpoints — nginx burst protection before application-layer IP limit
        # Handles /auth/verify, /auth/refresh, and other auth endpoints not matched above
        location /api/auth/ {
            client_max_body_size 16k;
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://api:8080/auth/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Share API — rate-limited to prevent token enumeration
        location /api/share/ {
            limit_req zone=share burst=10 nodelay;
            proxy_pass http://api:8080/share/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        # MinIO object storage — proxied, not exposed directly
        # HARD REQUIREMENT: MinIO bucket policy MUST be private (no anonymous access).
        # Pre-signed URLs are the sole access path.
        location ~ ^/photos/[a-f0-9-]+/(originals|thumbnails)/[a-f0-9-]+ {
            proxy_pass http://minio:9000;
            proxy_set_header Host          $host;
            proxy_set_header Authorization "";  # Strip ambient credentials at proxy layer
        }

        # NOTE: Trailing slash strips /api/ prefix — API routes are /auth/login, not /api/auth/login
        location /api/ {
            client_max_body_size 200M;  # Match Spring multipart limit for photo uploads
            proxy_pass http://api:8080/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
