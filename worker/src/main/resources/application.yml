spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jpt}
    username: ${DB_USER:jpt_worker}      # restricted DB user
    password: ${DB_PASS}
    hikari:
      maximum-pool-size: 5               # smaller pool for worker
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: false   # API service owns schema migrations; worker's restricted DB user has no DDL access
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      password: ${REDIS_PASSWORD}
  task:
    scheduling:
      pool:
        size: 3   # pollPhotoJobs + pollDeleteJobs + reclaimIdlePhotoJobs

worker:
  streams:
    claim-idle-time-ms: 1800000   # 30 minutes — must exceed worst-case RAW processing time
    max-retries: 3                 # Dead-letter after this many delivery attempts
  process:
    timeout-minutes: 5             # Per-tool ProcessBuilder timeout

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: jpt-photos

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
