# ============================================================
# CI NGINX — HTTP-only (no TLS) for CI/E2E testing (M24 fix)
# Based on nginx.prod.conf — same proxy rules and security headers,
# but without TLS certificates or HTTPS redirect.
# DO NOT use in production.
# ============================================================

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Rate limiting zones — by client IP
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=register:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=share:10m rate=60r/m;
    limit_req_status 429;

    # --------------------------------------------------------
    # HTTP (port 80) — no TLS, no HTTPS redirect
    # --------------------------------------------------------
    server {
        listen 80;
        server_name _;

        # ---- Security headers -----------------------------------------------
        # X-Content-Type-Options — prevent MIME-type sniffing
        add_header X-Content-Type-Options "nosniff" always;
        # X-Frame-Options — prevent framing (clickjacking)
        add_header X-Frame-Options "DENY" always;
        # Referrer-Policy — limit Referer header leakage
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # CSP — same as production except img-src uses localhost:9000 for CI MinIO.
        # style-src includes 'unsafe-inline' — required by Tailwind/shadcn.
        # CI deviation: img-src uses localhost:9000 instead of production MinIO domain
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: http://localhost:9000; style-src 'self' 'unsafe-inline'; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self';" always;
        # Permissions-Policy — no camera, microphone, geolocation, or payment API
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        # NOTE: HSTS header is intentionally omitted — HSTS over HTTP is meaningless
        # and would be ignored by browsers.
        # ---------------------------------------------------------------------

        # React SPA
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        # Share SPA pages — rate-limited to prevent token enumeration
        location /share/ {
            limit_req zone=share burst=10 nodelay;
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        # Block actuator endpoints from public access — must not be internet-reachable
        location /api/actuator/ {
            deny all;
            return 404;
        }

        # Login endpoint — tighter rate limit than generic auth (longest-prefix match takes precedence)
        location /api/auth/login {
            client_max_body_size 16k;
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://api:8080/auth/login;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto http;
        }

        # Register endpoint — tightest rate limit
        location /api/auth/register {
            client_max_body_size 16k;
            limit_req zone=register burst=3 nodelay;
            proxy_pass http://api:8080/auth/register;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto http;
        }

        # Auth endpoints — nginx burst protection before application-layer IP limit
        # Handles /auth/verify, /auth/refresh, and other auth endpoints not matched above
        location /api/auth/ {
            client_max_body_size 16k;
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://api:8080/auth/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto http;
        }

        # Share API — rate-limited to prevent token enumeration
        location /api/share/ {
            limit_req zone=share burst=10 nodelay;
            proxy_pass http://api:8080/share/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto http;
        }

        # MinIO object storage — proxied, not exposed directly
        # HARD REQUIREMENT: MinIO bucket policy MUST be private (no anonymous access).
        # Pre-signed URLs are the sole access path.
        location ~ ^/jpt-photos/[a-f0-9-]+/(originals|thumbnails)/[a-f0-9-]+ {
            proxy_pass http://minio:9000;
            proxy_set_header Host          $host;
            proxy_set_header Authorization "";  # Strip ambient credentials at proxy layer
        }

        # NOTE: Trailing slash strips /api/ prefix — API routes are /auth/login, not /api/auth/login
        location /api/ {
            client_max_body_size 200M;  # Match Spring multipart limit for photo uploads
            proxy_pass http://api:8080/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto http;
        }
    }
}
