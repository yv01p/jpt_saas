spring:
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
      location: /tmp
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jpt}
    username: ${DB_USER:jpt_app}
    password: ${DB_PASS}
    hikari:
      maximum-pool-size: 10
      connection-init-sql: "SET app.current_user_id = '00000000-0000-0000-0000-000000000000'"
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    url: ${FLYWAY_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/jpt}}
    user: ${FLYWAY_DB_USER:jpt}
    password: ${FLYWAY_DB_PASS}
    placeholders:
      jpt_app_password: ${DB_PASS}
      worker_db_user_password: ${WORKER_DB_PASS}
      jpt_auth_password: ${JPT_AUTH_PASSWORD}
      share_reader_password: ${SHARE_READER_PASSWORD}
  auth-datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/jpt}}
    username: jpt_auth
    password: ${JPT_AUTH_PASSWORD}
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      password: ${REDIS_PASSWORD}
    web:
      pageable:
        max-page-size: 200
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

jpt:
  trash:
    retention-days: 30

app:
  jwt-secret: ${JWT_SECRET}
  jwt-expiry-minutes: 15
  default-quota-bytes: 10737418240  # 10 GB
  refresh-token-expiry-days: 30
  rate-limit:
    upload: 100       # uploads per hour per user
    general: 1000     # general requests per hour per user
    auth: 20          # auth attempts per hour per IP
  cookie-secure: ${COOKIE_SECURE:true}
  default-share-days: 30
  base-url: ${APP_BASE_URL:http://localhost:8080}
  email:
    from: ${EMAIL_FROM:noreply@yourdomain.com}
  share-reader:
    jdbc-url: ${DB_URL:jdbc:postgresql://localhost:5432/jpt}
    username: share_reader
    password: ${SHARE_READER_PASSWORD}

server:
  forward-headers-strategy: native   # SA9-F2: use Tomcat RemoteIpValve with trusted proxy allowlist
  tomcat:
    remoteip:
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto
      internal-proxies: "172\\.\\d+\\.\\d+\\.\\d+|10\\.\\d+\\.\\d+\\.\\d+"
  error:
    include-stacktrace: never   # SA4-F3: never expose stack traces to clients
    include-message: never      # SA4-F3: never expose raw exception messages to clients

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  public-url: ${MINIO_PUBLIC_URL:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  presign-access-key: ${MINIO_PRESIGN_ACCESS_KEY}
  presign-secret-key: ${MINIO_PRESIGN_SECRET_KEY}
  bucket: jpt-photos
