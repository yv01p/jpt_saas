# application-e2e.yml — loaded when SPRING_PROFILES_ACTIVE=e2e (Docker E2E stack only)
#
# Purpose: provide dummy OAuth2 client registrations so Spring Boot can create the
# ClientRegistrationRepository bean required by .oauth2Login() in SecurityConfig.
# The credentials are non-functional — E2E tests use email/password auth only.
# Uses SimpleEmailService (not StubEmailService) so real emails go to mailpit.
spring:
  mail:
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:ci-unused}
            client-secret: ${GOOGLE_CLIENT_SECRET:ci-unused}
            scope: openid,email,profile
          github:
            client-id: ${GITHUB_CLIENT_ID:ci-unused}
            client-secret: ${GITHUB_CLIENT_SECRET:ci-unused}
            scope: "read:user,user:email"
