# api/src/test/resources/application-test.yml
app:
  jwt-secret: "test-secret-key-minimum-256-bits-for-hs256-signing"
  jwt-expiry-minutes: 15
  refresh-token-expiry-days: 1  # short TTL for expiry tests
  rate-limit:
    upload: 3       # low limits for fast test execution (RateLimitFilterTest relies on this)
    general: 100    # high enough for CRUD tests; RateLimitFilterTest overrides to 5 via @DynamicPropertySource
    auth: 20        # high enough not to break AuthControllerTest (RateLimitFilterTest overrides to 3)

spring:
  datasource:
    url: jdbc:tc:postgresql:16:///test?TC_DAEMON=true
    username: test
    password: test
    hikari:
      connection-init-sql: "SELECT 1"
  auth-datasource:
    url: jdbc:tc:postgresql:16:///test?TC_DAEMON=true
    username: test
    password: test
  flyway:
    url: jdbc:tc:postgresql:16:///test?TC_DAEMON=true
    user: test
    password: test
    placeholders:
      jpt_app_password: test_app_password
      worker_db_user_password: test_worker_password
      jpt_auth_password: test_auth_password  # [v4 CR3-C3]
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret
            scope: openid, email, profile
          github:
            client-id: test-github-client-id
            client-secret: test-github-client-secret
            scope: read:user, user:email
  data:
    redis:
      host: localhost  # Testcontainers manages this

# [v4 SA-10] Restrict actuator exposure
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
