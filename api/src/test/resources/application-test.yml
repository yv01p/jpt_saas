# api/src/test/resources/application-test.yml
app:
  jwt-secret: "test-secret-key-minimum-256-bits-for-hs256-signing"
  jwt-expiry-minutes: 15
  refresh-token-expiry-days: 1  # short TTL for expiry tests
  rate-limit:
    upload: 3       # low limits for fast test execution
    general: 5

spring:
  datasource:
    url: jdbc:tc:postgresql:16:///test?TC_DAEMON=true
    username: test
    password: test
    hikari:
      connection-init-sql: "SELECT 1"
  auth-datasource:
    url: jdbc:tc:postgresql:16:///test?TC_DAEMON=true
    username: test
    password: test
  flyway:
    url: jdbc:tc:postgresql:16:///test?TC_DAEMON=true
    user: test
    password: test
    placeholders:
      jpt_app_password: test_app_password
      worker_db_user_password: test_worker_password
      jpt_auth_password: test_auth_password  # [v4 CR3-C3]
  data:
    redis:
      host: localhost  # Testcontainers manages this

# [v4 SA-10] Restrict actuator exposure
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
