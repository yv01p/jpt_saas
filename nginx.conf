# ============================================================
# WARNING: NOT FOR PRODUCTION — NO TLS, NO SECURITY HEADERS
# See design doc v4.0 for full production nginx configuration.
# ============================================================

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        # NOTE: Trailing slash strips /api/ prefix — API routes are /auth/login, not /api/auth/login
        location /api/ {
            proxy_pass http://api:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # TODO: Add for production — certbot ACME challenge for TLS cert renewal
        # location /.well-known/acme-challenge/ {
        #     root /var/www/certbot;
        # }
    }
}
