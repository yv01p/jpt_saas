# ============================================================
# DEV ONLY — NO TLS, NO SECURITY HEADERS
# Production config: nginx.prod.conf (mounted by docker-compose.yml)
# ============================================================

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    server {
        listen 80;

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        # Block actuator endpoints from public access — Spring Boot actuator must not be internet-reachable
        location /api/actuator/ {
            deny all;
            return 404;
        }

        # Auth endpoints — burst-protect with nginx before application-layer hourly IP limit
        location /api/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://api:8080/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # NOTE: Trailing slash strips /api/ prefix — API routes are /auth/login, not /api/auth/login
        location /api/ {
            proxy_pass http://api:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
